name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate website
        run: |
          for file in web/js/*.js web/sw.js; do node --check "$file"; done
          npm ci --prefix web/tools
          cd web/tools
          npx playwright install --with-deps chromium
          set +e
          npm test 2>&1 | tee "$RUNNER_TEMP/karaokenatin-tests.log"
          test_status=("${PIPESTATUS[@]}")
          set -e
          if [ "${test_status[0]}" -ne 0 ]; then
            # Preserve useful diagnostics in the run annotations as well as the log.
            details="$(tail -n 30 "$RUNNER_TEMP/karaokenatin-tests.log")"
            details="${details//'%'/'%25'}"
            details="${details//$'\r'/'%0D'}"
            details="${details//$'\n'/'%0A'}"
            printf '::error title=Website tests failed::%s\n' "$details"
            exit "${test_status[0]}"
          fi
          exit "${test_status[1]}"
      - name: Prepare static website
        run: |
          mkdir _site
          cp web/index.html web/manifest.webmanifest web/sw.js _site/
          cp -R web/css web/js web/icons _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
